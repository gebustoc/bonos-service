apiVersion: apps/v1
kind: Deployment
metadata:
  name: bonos-service
  labels:
    app: bonos-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bonos-service
  template:
    metadata:
      labels:
        app: bonos-service
    spec:
      containers:
        - name: bonos-service
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/bonos-service:latest
          ports:
            - containerPort: 3001
          # Probe de "vivo": si falla, Kubernetes reinicia el contenedor.
          livenessProbe:
            httpGet:
              path: /livez
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          # Probe de "listo": si falla, no recibe tráfico desde el Service.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

          env:
              - name: DB_HOST
                value: "casino-db"
              - name: POSTGRES_USER
                value: "casino"
              - name: POSTGRES_PASSWORD
                value: "casino"
              - name: POSTGRES_DB
                value: "casino_db"