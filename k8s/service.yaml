apiVersion: v1
kind: Service
metadata:
  name: bonos-service
  labels:
    app: bonos-service
spec:
  # ClusterIP = solo accesible DENTRO del clúster.
  # Otros servicios lo alcanzan vía DNS interno: http://bonos-service:8001
  type: ClusterIP
  selector:
    app: bonos-service
  ports:
    - name: http
      protocol: TCP
      port: 8001        # puerto del Service (DNS interno)
      targetPort: 3001  # puerto del contenedor